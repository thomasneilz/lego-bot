name: Bot LEGO

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # secours : GitHub saute souvent ces créneaux
  workflow_dispatch:                # déclenché toutes les 15 min par cron-job.org, ou à la main
    inputs:
      status:
        description: "M'envoyer l'état des sources sur Telegram"
        type: boolean
        default: false

# Jamais deux passages en même temps (ils se marcheraient dessus dans seen.json)
concurrency:
  group: lego-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Garde en mémoire les annonces déjà envoyées entre deux passages
      - uses: actions/cache@v4
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      # Ton stock (/achat, /stock) : mémoire privée, non visible publiquement
      # contrairement aux fichiers du dépôt. Sauvegarde aussi envoyée dans Telegram.
      - uses: actions/cache@v4
        with:
          path: stock.json
          key: stock-${{ github.run_id }}
          restore-keys: stock-

      - name: Chercher les deals
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_DISCOUNT: "30"
          RETIRE_WINDOW: "183"
        run: python bot.py ${{ inputs.status && '--status' || '' }}
